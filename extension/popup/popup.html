<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PV-IDM Integration</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-title">
      <img src="../icons/icon32.png" class="logo-img" width="22" height="22" alt="PV-IDM">
      <span class="title">PV-IDM</span>
    </div>
    <span id="engine-badge" class="badge badge-disconnected">Checking...</span>
  </div>

  <!-- Direct URL Download Box -->
  <div class="card add-url-card">
    <div class="card-title">Add URL to Download:</div>
    <div class="input-group">
      <input type="text" id="input-url" placeholder="https://example.com/file.zip" autocomplete="off" spellcheck="false">
      <button id="btn-start-download" class="btn btn-primary">➕ Download</button>
    </div>
    <div id="url-feedback" class="feedback-msg"></div>
  </div>

  <!-- Detected Media Card -->
  <div id="media-card" class="card media-card" style="display: none;">
    <div class="card-title">🎥 Detected Media Streams:</div>
    <div id="media-list" class="media-list"></div>
  </div>

  <!-- Settings Toggles -->
  <div class="card">
    <div class="setting-row">
      <label for="toggle-intercept">Automatic Download Intercept</label>
      <input type="checkbox" id="toggle-intercept" checked>
    </div>
    <div class="setting-row">
      <label for="toggle-sniffer">Floating Video Sniffer</label>
      <input type="checkbox" id="toggle-sniffer" checked>
    </div>
  </div>

  <!-- Open Desktop App -->
  <div class="actions">
    <button id="btn-open-gui" class="btn btn-secondary btn-full">🖥 Open PV-IDM Desktop App</button>
  </div>

  <div class="footer">
    <span class="version">PV-IDM v1.1.4 (Native Bridge)</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
