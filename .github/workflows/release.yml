name: Release & Asset Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Application & Extension Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools & dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1 file
          python -m pip install --upgrade pip build pyinstaller PyQt6

      # 1. Build Python Wheel & sdist
      - name: Build Python Package (Wheel & sdist)
        run: |
          python -m build

      # 2. Build Standalone Linux Executable with PyInstaller
      - name: Build Standalone Binary (PyInstaller)
        run: |
          pyinstaller --name pv-idm \
            --onedir \
            --windowed \
            --add-data "extension/icons:extension/icons" \
            --add-data "scripts:scripts" \
            --icon extension/icons/icon128.png \
            idm_gui/app.py
          
          # Bundle into distributable tarball
          cd dist && tar -czvf pv-idm-standalone-x86_64.tar.gz pv-idm/ && cd ..

      # 3. Build AppDir & AppImage
      - name: Build AppImage
        run: |
          bash ./scripts/build_appimage.sh
          # Download appimagetool
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun dist/AppDir dist/pv-idm-x86_64.AppImage || true

      # 4. Package Extensions (Chrome MV3 & Firefox)
      - name: Package Browser Extensions
        run: |
          python scripts/package_extensions.py

      # 5. Upload Artifacts for Workflow Run
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pv-idm-build-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.xpi
            dist/*.AppImage

      # 6. Create GitHub Release (on tag)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.xpi
            dist/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows Application Packages
    runs-on: windows-latest
    needs: build-and-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 yt-dlp pillow

      - name: Download Bundled Binaries (yt-dlp.exe & ffmpeg.exe)
        run: |
          python scripts/download_windows_binaries.py

      - name: Build Standalone Windows Application (PyInstaller)
        run: |
          pyinstaller --noconfirm scripts/pv-idm.spec

      - name: Create Windows Release ZIP
        run: |
          Copy-Item scripts/install-native-host.bat dist/pv-idm/
          Compress-Archive -Path dist/pv-idm/* -DestinationPath dist/pv-idm-windows-standalone-x86_64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pv-idm-windows-build-artifacts
          path: dist/pv-idm-windows-standalone-x86_64.zip

      - name: Upload Windows Package to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/pv-idm-windows-standalone-x86_64.zip
